<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Join the Dots - London</title>

<link
    href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
    rel="stylesheet"
/>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: white;
}

#map {
    width: 100%;
    height: 80vh;
}

#controls {
    padding: 15px;
    text-align: center;
}

#title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 5px;
}

#status {
    margin-bottom: 12px;
}

button {
    padding: 8px 16px;
    margin: 0 4px;
    border: 1px solid #999;
    background: white;
    cursor: pointer;
    border-radius: 4px;
}

button:hover {
    background: #eee;
}

</style>

</head>


<body>


<div id="controls">

    <div id="title">
        Join the Dots: London
    </div>

    <div id="status">
        Connect dot 1
    </div>

    <button onclick="resetGame()">
        Reset
    </button>

    <button onclick="reveal()">
        Reveal
    </button>

</div>


<div id="map"></div>


<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>


<script>


// ======================================================
// DIFFICULTY SETTINGS
// ======================================================

const DIFFICULTIES = {

    easy: 50,

    medium: 100,

    hard: 200

};


// Change this to:
// "easy"
// "medium"
// "hard"

const DIFFICULTY = "easy";


const DOT_COUNT = DIFFICULTIES[DIFFICULTY];


// ======================================================
// GLOBAL VARIABLES
// ======================================================

let map;

let coordinates = [];

let puzzleDots = [];

let currentDot = 0;

let completedLine = [];


// ======================================================
// LOAD LONDON BOUNDARY
// ======================================================

fetch("londoneasy.json")

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Could not load londoneasy.json"
            );

        }

        return response.json();

    })

    .then(data => {

        console.log("GeoJSON:", data);

        // Extract the original 1,493-point boundary
        coordinates = extractCoordinates(data);

        console.log(
            "Original boundary points:",
            coordinates.length
        );


        // Create the actual puzzle dots
        puzzleDots = createPuzzleDots(
            coordinates,
            DOT_COUNT
        );


        console.log(
            "Puzzle dots:",
            puzzleDots.length
        );


        // Start the map
        initialiseMap();

    })

    .catch(error => {

        console.error(error);

        document.getElementById("status").innerText =
            "Error loading London boundary";

    });


// ======================================================
// EXTRACT COORDINATES FROM GEOJSON
// ======================================================

function extractCoordinates(data) {

    // Mapshaper exported a GeometryCollection

    if (data.type === "GeometryCollection") {

        const geometry = data.geometries[0];

        if (geometry.type === "LineString") {

            return geometry.coordinates;

        }

    }


    // Also support a normal LineString

    if (data.type === "LineString") {

        return data.coordinates;

    }


    // Support a FeatureCollection just in case

    if (data.type === "FeatureCollection") {

        const feature = data.features[0];

        if (!feature) {

            throw new Error(
                "No features found in GeoJSON"
            );

        }

        const geometry = feature.geometry;


        if (geometry.type === "LineString") {

            return geometry.coordinates;

        }

    }


    throw new Error(
        "Unsupported GeoJSON structure: " +
        data.type
    );

}


// ======================================================
// CREATE EVENLY SPACED PUZZLE DOTS
// ======================================================

function createPuzzleDots(
    coordinates,
    dotCount
) {

    // Close the boundary
    // by adding the first coordinate to the end

    const closedCoordinates = [
        ...coordinates,
        coordinates[0]
    ];


    // Convert to Turf LineString

    const line = turf.lineString(
        closedCoordinates
    );


    // Measure complete boundary

    const totalLength = turf.length(
        line,
        {
            units: "kilometers"
        }
    );


    const dots = [];


    // Place dots at equal distances

    for (
        let i = 0;
        i < dotCount;
        i++
    ) {

        const distance =
            (totalLength * i) / dotCount;


        const point = turf.along(
            line,
            distance,
            {
                units: "kilometers"
            }
        );


        dots.push(
            point.geometry.coordinates
        );

    }


    return dots;

}


// ======================================================
// INITIALISE MAP
// ======================================================

function initialiseMap() {

    map = new maplibregl.Map({

        container: "map",

        style:
            "https://tiles.openfreemap.org/styles/positron",

        center: [
            -0.1276,
            51.5072
        ],

        zoom: 9

    });


    map.addControl(
        new maplibregl.NavigationControl(),
        "top-right"
    );


    map.on("load", () => {


        // ==================================================
        // CREATE DOT DATA
        // ==================================================

        const dots = {

            type: "FeatureCollection",

            features:

                puzzleDots.map(
                    (coord, index) => ({

                        type: "Feature",

                        geometry: {

                            type: "Point",

                            coordinates: coord

                        },

                        properties: {

                            number:
                                index + 1

                        }

                    })
                )

        };


        // ==================================================
        // ADD DOT SOURCE
        // ==================================================

        map.addSource(
            "dots",
            {

                type: "geojson",

                data: dots

            }
        );


        // ==================================================
        // DOT CIRCLES
        // ==================================================

        map.addLayer({

            id: "dot-circles",

            type: "circle",

            source: "dots",

            paint: {

                "circle-radius": 8,

                "circle-color": "#ffffff",

                "circle-stroke-color":
                    "#000000",

                "circle-stroke-width": 1.5

            }

        });


        // ==================================================
        // DOT NUMBERS
        // ==================================================

        map.addLayer({

            id: "dot-numbers",

            type: "symbol",

            source: "dots",

            layout: {

                "text-field":
                    ["get", "number"],

                "text-size": 10,

                "text-font": [
                    "Noto Sans Regular"
                ],

                "text-allow-overlap": true

            },

            paint: {

                "text-color": "#000000"

            }

        });


        // ==================================================
        // ANSWER LINE SOURCE
        // ==================================================

        map.addSource(

            "answer-line",

            {

                type: "geojson",

                data: {

                    type:
                        "FeatureCollection",

                    features: []

                }

            }

        );


        // ==================================================
        // ANSWER LINE
        // ==================================================

        map.addLayer({

            id: "answer-line",

            type: "line",

            source: "answer-line",

            paint: {

                "line-color":
                    "#000000",

                "line-width": 2

            }

        });


        // ==================================================
        // CLICK DOTS
        // ==================================================

        map.on(
            "click",
            "dot-circles",
            handleDotClick
        );


        // Cursor

        map.on(
            "mouseenter",
            "dot-circles",
            () => {

                map.getCanvas().style.cursor =
                    "pointer";

            }
        );


        map.on(
            "mouseleave",
            "dot-circles",
            () => {

                map.getCanvas().style.cursor =
                    "";

            }
        );


        // ==================================================
        // FIT MAP TO LONDON
        // ==================================================

        const bbox = turf.bbox(

            turf.lineString(
                coordinates
            )

        );


        map.fitBounds(

            bbox,

            {

                padding: 50

            }

        );

    });

}


// ======================================================
// HANDLE DOT CLICK
// ======================================================

function handleDotClick(e) {

    const number =
        Number(
            e.features[0].properties.number
        );


    // Correct dot

    if (
        number ===
        currentDot + 1
    ) {

        currentDot++;


        // Add the clicked dot

        completedLine.push(
            puzzleDots[number - 1]
        );


        updateLine();


        // Puzzle completed

        if (
            currentDot ===
            puzzleDots.length
        ) {


            // Close the boundary

            completedLine.push(
                puzzleDots[0]
            );


            updateLine();


            document.getElementById(
                "status"
            ).innerHTML =

                "<strong>🎉 London complete!</strong>";


        }

        else {

            document.getElementById(
                "status"
            ).innerText =

                "Connect dot " +
                (currentDot + 1);

        }

    }


    // Wrong dot

    else {

        document.getElementById(
            "status"
        ).innerText =

            "That's dot " +
            number +
            ". Connect dot " +
            (currentDot + 1);

    }

}


// ======================================================
// UPDATE CONNECTING LINE
// ======================================================

function updateLine() {

    const line = {

        type: "Feature",

        geometry: {

            type: "LineString",

            coordinates:
                completedLine

        },

        properties: {}

    };


    map.getSource(
        "answer-line"
    ).setData({

        type:
            "FeatureCollection",

        features: [
            line
        ]

    });

}


// ======================================================
// RESET GAME
// ======================================================

function resetGame() {

    currentDot = 0;

    completedLine = [];


    map.getSource(
        "answer-line"
    ).setData({

        type:
            "FeatureCollection",

        features: []

    });


    document.getElementById(
        "status"
    ).innerText =
        "Connect dot 1";

}


// ======================================================
// REVEAL
// ======================================================

function reveal() {

    completedLine = [
        ...puzzleDots,
        puzzleDots[0]
    ];


    currentDot =
        puzzleDots.length;


    updateLine();


    document.getElementById(
        "status"
    ).innerHTML =

        "<strong>London revealed!</strong>";

}


</script>

</body>

</html>
